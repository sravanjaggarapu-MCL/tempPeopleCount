[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "people-count"
version = "1.0.0"
description = "Store footfall: count people entering and exiting with YOLOv8 + ByteTrack"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.3.0", "opencv-python>=4.8.0", "numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
