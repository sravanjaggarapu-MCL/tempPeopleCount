# People Count - configuration
# Camera username/password are NOT stored here. Put them in .env
# (copy .env.example to .env). .env is git-ignored.

camera:
  host: 172.20.100.138
  port: 554
  stream_path: /cam/realmonitor?channel=1&subtype=1   # Dahua sub-stream
  use_threaded_capture: true      # live streams: keep only the newest frame
  max_reconnect_attempts: 10
  reconnect_delay_seconds: 2.0
  frame_timeout_seconds: 10.0
  cameras_file: cameras.json      # remembered cameras (git-ignored, has passwords)
  max_remembered_cameras: 10

model:
  weights: weights/yolov8n.pt     # downloaded automatically on first run
  inference_size: 480             # 320 faster, 640 more accurate
  person_class_id: 0              # COCO class 0 = person
  detect_conf_threshold: 0.4      # detect mode only
  track_conf_threshold: 0.15      # keep LOW: ByteTrack needs weak detections
  tracker_config: configs/bytetrack.yaml

counting:
  dead_zone_px: 12                # ignore band around the line (scale up for 1080p)
  min_track_age_frames: 3         # brand-new tracks cannot count yet
  min_line_length: 10
  line_dir: outputs/lines         # one saved line per camera
  legacy_line_file: counting_line.json
  events_dir: outputs/events      # daily CSV of every entry/exit
  save_events: true

display:
  window_width: 1280
  window_height: 720
  setup_window_width: 1280
  trail_length: 30
  event_log_length: 5
  # Colours are [B, G, R]
  box_color: [0, 255, 0]
  label_text_color: [0, 0, 0]
  hud_color: [0, 255, 255]
  line_color: [0, 0, 255]
  dead_zone_color: [0, 165, 255]
  entry_arrow_color: [0, 255, 0]
